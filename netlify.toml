[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect old article paths to zh-tw (existing links/index)
[[redirects]]
  from = "/articles/*"
  to = "/zh-tw/articles/:splat"
  status = 301

# Redirect old root about page
[[redirects]]
  from = "/about.html"
  to = "/zh-tw/about.html"
  status = 301
